<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1026" />
  <title>A Torre das Sete Luzes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0b1026;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
    }
    #game { width: 100%; height: 100%; }
    #game canvas { display: block; }
    /* Input de nome usado na cutscene */
    #name-overlay {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(4, 6, 18, 0.72); z-index: 20;
    }
    #name-overlay.visible { display: flex; }
    .name-panel {
      background: linear-gradient(180deg, #f3e6c4, #e4d0a1);
      border: 3px solid #7a5b23; border-radius: 6px;
      padding: 28px 32px; text-align: center;
      box-shadow: 0 0 60px rgba(255, 190, 80, 0.35);
      max-width: 88vw;
    }
    .name-panel h2 {
      font-family: 'Cinzel', serif; color: #4a2f10;
      font-size: 20px; margin-bottom: 14px; letter-spacing: 1px;
    }
    .name-panel input {
      font-family: 'IM Fell English', serif; font-size: 22px;
      padding: 8px 12px; width: 260px; max-width: 70vw;
      border: 2px solid #7a5b23; border-radius: 4px;
      background: #fbf3dd; color: #2c1c08; text-align: center; outline: none;
    }
    .name-panel button {
      font-family: 'Cinzel', serif; font-weight: 700;
      display: block; margin: 16px auto 0; padding: 10px 26px;
      font-size: 16px; letter-spacing: 1px; cursor: pointer;
      color: #f6ecd2; background: #7a1f1f;
      border: 2px solid #4a1010; border-radius: 4px;
    }
    .name-panel button:hover { background: #963030; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="name-overlay">
    <div class="name-panel">
      <h2>Qual é o vosso nome, Sir?</h2>
      <input id="name-input" maxlength="16" placeholder="Vosso nome" autocomplete="off" />
      <button id="name-confirm">Assim seja</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
