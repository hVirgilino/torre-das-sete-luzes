<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1026" />
  <title>A Torre das Sete Luzes</title>
  <!-- fontes são self-hosted via @fontsource (importadas em src/main.ts) -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0b1026;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
    }
    /* 100dvh acompanha a barra de endereço do Android; o JS ainda ajusta a
       altura exata via visualViewport, isto é só o valor de partida */
    #game { width: 100%; height: 100%; height: 100dvh; }
    #game canvas { display: block; }
    /* Gire o aparelho — 16:9 deitado numa tela em pé vira uma tira ilegível */
    #rotate-overlay {
      position: fixed; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; text-align: center;
      background: #0b1026; color: #f3e6c4; z-index: 30;
      font-family: 'Cinzel', serif;
    }
    #rotate-overlay.visible { display: flex; }
    #rotate-overlay .glyph {
      font-size: 64px; line-height: 1; color: #ffc24d;
      animation: tip 1.8s ease-in-out infinite;
    }
    #rotate-overlay p { font-size: 18px; letter-spacing: 1px; max-width: 22ch; }
    #rotate-overlay small { font-size: 13px; color: #aeb8e8; font-family: 'IM Fell English', serif; }
    @keyframes tip {
      0%, 45%, 100% { transform: rotate(0deg); }
      70%, 90% { transform: rotate(-90deg); }
    }
    /* Input de nome usado na cutscene */
    #name-overlay {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(4, 6, 18, 0.72); z-index: 20;
    }
    #name-overlay.visible { display: flex; }
    .name-panel {
      background: linear-gradient(180deg, #f3e6c4, #e4d0a1);
      border: 3px solid #7a5b23; border-radius: 6px;
      padding: 28px 32px; text-align: center;
      box-shadow: 0 0 60px rgba(255, 190, 80, 0.35);
      max-width: 88vw;
    }
    .name-panel h2 {
      font-family: 'Cinzel', serif; color: #4a2f10;
      font-size: 20px; margin-bottom: 14px; letter-spacing: 1px;
    }
    .name-panel input {
      font-family: 'IM Fell English', serif; font-size: 22px;
      padding: 8px 12px; width: 260px; max-width: 70vw;
      border: 2px solid #7a5b23; border-radius: 4px;
      background: #fbf3dd; color: #2c1c08; text-align: center; outline: none;
    }
    .name-panel button {
      font-family: 'Cinzel', serif; font-weight: 700;
      display: block; margin: 16px auto 0; padding: 10px 26px;
      font-size: 16px; letter-spacing: 1px; cursor: pointer;
      color: #f6ecd2; background: #7a1f1f;
      border: 2px solid #4a1010; border-radius: 4px;
    }
    .name-panel button:hover { background: #963030; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-overlay">
    <div class="glyph">▯</div>
    <p>Gire o aparelho</p>
    <small>A Torre se ergue deitada, Sir — vire o telefone para o lado.</small>
  </div>
  <div id="name-overlay">
    <div class="name-panel">
      <h2>Qual é o vosso nome, Sir?</h2>
      <input id="name-input" maxlength="16" placeholder="Vosso nome" autocomplete="off" />
      <button id="name-confirm">Assim seja</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
